<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Підтримка платформи · вхід</title>
<style>
  :root {
    --bg: #f7f8fb;
    --bg-glow-a: rgba(99, 102, 241, .12);
    --bg-glow-b: rgba(168, 85, 247, .10);
    --surface: #fff;
    --line: rgba(15, 23, 42, .08);
    --line-strong: rgba(15, 23, 42, .14);
    --text: #0f172a;
    --muted: #64748b;
    --faint: #94a3b8;
    --accent: #4f46e5;
    --accent-2: #a855f7;
    --accent-soft: rgba(79, 70, 229, .10);
    --shadow-lg: 0 30px 70px -24px rgba(15, 23, 42, .3);
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #07080c;
      --bg-glow-a: rgba(99, 102, 241, .2);
      --bg-glow-b: rgba(168, 85, 247, .14);
      --surface: #12151d;
      --line: rgba(255, 255, 255, .08);
      --line-strong: rgba(255, 255, 255, .16);
      --text: #e8eaf2;
      --muted: #98a2b8;
      --faint: #6b7590;
      --accent: #7c78ff;
      --accent-2: #c084fc;
      --accent-soft: rgba(124, 120, 255, .16);
      --shadow-lg: 0 30px 70px -24px rgba(0, 0, 0, .85);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text);
    font: 15px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: -30%; z-index: -1;
    background:
      radial-gradient(36% 40% at 22% 18%, var(--bg-glow-a), transparent 70%),
      radial-gradient(32% 36% at 78% 82%, var(--bg-glow-b), transparent 70%);
    animation: drift 26s var(--ease) infinite alternate;
  }
  @keyframes drift { to { transform: translate3d(2%, -2%, 0) scale(1.06); } }

  form {
    width: min(380px, 100%);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; padding: 30px 28px 26px;
    box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column; gap: 14px;
    animation: rise .55s var(--ease) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } }

  .mark {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 24px -8px var(--accent);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 16px;
    margin-bottom: 4px;
  }
  h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.02em; }
  p { margin: 0; color: var(--muted); font-size: 13.5px; }

  .field { position: relative; }
  input {
    width: 100%; background: transparent; color: var(--text); font: inherit;
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none;
    transition: border-color .22s, box-shadow .22s;
  }
  input:focus { border-color: color-mix(in srgb, var(--accent) 50%, transparent); box-shadow: 0 0 0 4px var(--accent-soft); }
  input::placeholder { color: var(--faint); }

  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: 0; border-radius: 12px; padding: 12px; font: inherit; font-weight: 600;
    cursor: pointer; box-shadow: 0 10px 24px -10px var(--accent);
    transition: transform .2s var(--ease), box-shadow .2s var(--ease), opacity .2s;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 14px 30px -10px var(--accent); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { opacity: .6; cursor: default; }

  .err { min-height: 18px; font-size: 13px; color: #f43f5e; }
  form.shake { animation: shake .42s var(--ease); }
  @keyframes shake {
    20% { transform: translateX(-7px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(2px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<form id="form">
  <div class="mark">A</div>
  <h1>Підтримка платформи</h1>
  <p>Введіть код доступу, щоб продовжити.</p>
  <div class="field">
    <input id="code" type="password" placeholder="Код доступу" autocomplete="current-password" autofocus>
  </div>
  <button type="submit" id="btn">Увійти</button>
  <div class="err" id="err"></div>
</form>
<script>
const form = document.getElementById('form');
const err = document.getElementById('err');
const btn = document.getElementById('btn');

form.onsubmit = async (e) => {
  e.preventDefault();
  err.textContent = '';
  btn.disabled = true; btn.textContent = 'Перевіряю…';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: document.getElementById('code').value }),
    });
    if (resp.ok) { location.reload(); return; }
    err.textContent = 'Невірний код';
    form.classList.add('shake');
    setTimeout(() => form.classList.remove('shake'), 450);
  } catch (_) {
    err.textContent = 'Немає зв’язку із сервером';
  }
  btn.disabled = false; btn.textContent = 'Увійти';
  document.getElementById('code').select();
};
</script>
</body>
</html>
