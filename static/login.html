<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Підтримка платформи · вхід</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e7e9ee; --muted:#939aab; --accent:#6aa9ff; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --panel:#fff; --line:#e3e6ec; --text:#131720; --muted:#6b7280; --accent:#1f6feb; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  form {
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:26px; width:min(360px, 92vw); display:flex; flex-direction:column; gap:12px;
  }
  h1 { font-size:16px; margin:0; }
  p { margin:0; color:var(--muted); font-size:13px; }
  input {
    background:var(--bg); color:var(--text); font:inherit;
    border:1px solid var(--line); border-radius:8px; padding:10px 12px;
  }
  button {
    background:var(--accent); color:#fff; border:0; border-radius:8px;
    padding:11px; font-weight:600; cursor:pointer; font:inherit;
  }
  .err { color:#ff6b6b; font-size:13px; min-height:18px; }
</style>
</head>
<body>
<form id="form">
  <h1>Підтримка платформи</h1>
  <p>Введіть код доступу.</p>
  <input id="code" type="password" autocomplete="current-password" autofocus>
  <button type="submit">Увійти</button>
  <div class="err" id="err"></div>
</form>
<script>
const form = document.getElementById('form');
const err = document.getElementById('err');
form.onsubmit = async (e) => {
  e.preventDefault();
  err.textContent = '';
  const resp = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: document.getElementById('code').value }),
  });
  if (resp.ok) location.reload();
  else err.textContent = 'Невірний код';
};
</script>
</body>
</html>
